services:
  db:
    image: postgres:17-alpine
    container_name: upwatch-db
    environment:
      POSTGRES_USER: upwatch
      POSTGRES_PASSWORD: upwatch
      POSTGRES_DB: upwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upwatch -d upwatch"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata: